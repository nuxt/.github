name: Dependency review

on:
  workflow_call:
    inputs:
      fail-on-provenance-change:
        description: 'Fail the workflow if provenance changes are detected'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - name: Check provenance downgrades
            uses: danielroe/provenance-action@fcc45fd5a5b818c477432b32c838dcd0c79cd2dd # v0.2.0
            with:
              fail-on-provenance-change: ${{ inputs.fail-on-provenance-change }}

          - name: Dependency review
            if: github.event.pull_request || github.event.merge_group
            uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
            with:
              base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
              head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
